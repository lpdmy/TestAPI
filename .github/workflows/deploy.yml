name: Deploy .NET API to Azure

on:
  push:
    branches:
      - 'integration/*'   # ví dụ integration/1.0.0
      - 'release/*'       # ví dụ release/1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to Azure Dev
        if: startsWith(github.ref, 'refs/heads/integration/')
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'myapi-dev'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: ./publish

      - name: Deploy to Azure Test
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'myapi-test'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TEST }}
          package: ./publish
